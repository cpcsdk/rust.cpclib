[package]
name = "cpclib-python"
version.workspace = true
edition.workspace = true
description = "Python wrappers for cpclib components using pyo3"
license.workspace = true

[lib]
name = "cpclib_python"
crate-type = ["cdylib", "rlib"]
test = false

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { workspace = true, features = ["extension-module"] }
bon.workspace = true
cpclib-asm = { workspace = true, default-features = false }
cpclib-basic = { workspace = true, default-features = false }
cpclib-basm = { workspace = true, default-features = false }
cpclib-bdasm = { workspace = true, default-features = false }
cpclib-bndbuild = { workspace = true, default-features = false, features = ["fap", "rayon"] }
cpclib-cpr = { workspace = true, default-features = false }
cpclib-crunchers = { workspace = true, default-features = false }
cpclib-crunch = { workspace = true }
shlex.workspace = true
cpclib-asmfmt = { workspace = true }
cpclib-csl = { workspace = true }
cpclib-orgams-ascii = { workspace = true }
cpclib-xfer = { workspace = true }
cpclib-basmopt = { workspace = true }
cpclib-lsp = { workspace = true }
tower-lsp.workspace = true
cpclib-runner = { workspace = true, default-features = false, features = ["screenshot"] }
cpclib-dap = { workspace = true }
cpclib-image = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
camino-tempfile.workspace = true
cpclib-disc = { workspace = true, default-features = false }
cpclib-common = { workspace = true, default-features = false }
cpclib-sna = { workspace = true, features = ["cmdline", "interactive"], default-features = false }

[package.metadata]
# Notes: This crate provides Python bindings; extend with real wrappers as needed.

[package.metadata.maturin]
features = ["extension-module"]

[build-dependencies]
pyo3-build-config.workspace = true
