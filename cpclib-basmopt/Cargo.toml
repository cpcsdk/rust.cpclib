[package]

name = "cpclib-basmopt"
version.workspace = true
description = "Z80 peephole optimization advisor/fixer for basm sources (cpclib-asmoptim's engine as a CLI tool)"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[package.metadata.workspaces]
independent = true

[dependencies]
cpclib-asm.workspace = true
cpclib-asmoptim.workspace = true
cpclib-common.workspace = true
cpclib-tokens.workspace = true
ignore.workspace = true
camino.workspace = true
fs-err.workspace = true
thiserror.workspace = true
clap = { workspace = true, features = ["derive"], optional = true }
indicatif = { workspace = true, optional = true }

[dev-dependencies]
camino-tempfile.workspace = true

[features]
cmdline = ["dep:clap"]
# Terminal progress bars during a real (possibly slow) analysis - see
# `analyze_source`'s own doc comment. Kept optional and off the `cmdline`
# feature, matching `cpclib-asm`/`cpclib-basm`'s own convention: a future
# library consumer (the LSP, per this crate's own module doc comment) must
# never have `indicatif` terminal output mixed into its own stdout channel.
indicatif = ["dep:indicatif", "cpclib-asm/indicatif"]
default = ["indicatif"]

[[bin]]
name = "basmopt"
path = "src/main.rs"
required-features = ["cmdline"]
