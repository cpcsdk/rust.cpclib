[package]
name = "cpclib-runner"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

resolver = "2"
description = "Dependency for various cpclib crates to help running external applications (mostly assemblers or emulators)"

[dependencies]
# Opening a URL is not three lines of `cfg!`: WSL, snap-confined browsers and
# `BROWSER=` all need handling, and getting one wrong looks like "it opened
# nothing and said nothing". Already in the lockfile via the egui crates.
webbrowser.workspace = true
cpclib-common = {workspace=true, features=["network"]}
cpclib-asm.workspace=true
cpclib-csl.workspace=true
cpclib-disc = {workspace=true, optional=true}

camino-tempfile.workspace = true
clap = {workspace=true, features=["derive"]}
delegate.workspace = true
enigo = {workspace = true, features = ["x11rb"]}
sevenz-rust2 = {workspace = true, optional = true}
shlex.workspace = true
utf8-chars.workspace = true
xcap = {workspace = true, optional = true}
rust-embed = { workspace = true, features = ["compression", "debug-embed"] }

bon.workspace = true
directories.workspace = true
portable-pty.workspace = true
flate2.workspace = true
fs-err.workspace = true
glob.workspace = true
tar.workspace = true
rust-ini.workspace = true
scraper.workspace = true
transparent = { workspace = true, optional = true }
xz2.workspace = true
wmctrl.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
fs_extra.workspace = true

[features]
default = ["fap", "screenshot", "archive-7z"]
transparent-x11 = ["dep:transparent"]
screenshot = ["dep:xcap"]
fap = []
archive-7z = ["dep:sevenz-rust2"]
hfe = ["dep:cpclib-disc", "cpclib-disc/hfe"]
