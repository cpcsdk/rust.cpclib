[package]
name = "cpclib-asm"
version.workspace = true
description = "cpclib libraries related to z80 assembling"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[package.metadata.workspaces]
independent = true

[dependencies]
cpclib-basic.workspace = true
cpclib-crunchers.workspace = true
cpclib-sna.workspace = true
cpclib-tokens.workspace = true
cpclib-z80flow.workspace = true
cpclib-disc.workspace = true
fs-err.workspace = true
cpclib-common.workspace = true
cpclib-cpr.workspace = true
cpclib-image.workspace = true
cpclib-files.workspace = true

arrayref.workspace = true
#assert_matches.workspace = true
#camino-tempfile.workspace = true
cfg-if.workspace = true
codespan-reporting.workspace = true
#crc.workspace = true
custom_error.workspace = true
delegate.workspace = true
either.workspace = true
#encoding_rs.workspace = true
getset.workspace = true
globset.workspace = true
hashbag.workspace = true
indicatif = {workspace = true, optional=true}
line-span.workspace = true
libc.workspace = true
ouroboros.workspace = true
paste.workspace = true
regex.workspace = true
rust-embed = { workspace = true, features = ["compression", "debug-embed"] }
serde = { workspace = true, features = ["derive"] }
# Already in the lockfile via cpclib-dap; used to write/read `--sourcemap`.
serde_json.workspace = true
smallvec = {workspace = true}
#smartstring.workspace = true
substring.workspace = true
velcro.workspace = true
rayon-cond = { workspace = true, optional = true }
chardetng = {workspace = true, optional = true}
aho-corasick.workspace = true
compact_str.workspace = true
beef.workspace = true
enumflags2.workspace = true
prettydiff.workspace = true
memchr.workspace = true

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
gag.workspace = true


[[bench]]
name = "parser_strings"
harness = false

[[bench]]
name = "parse_factor"
harness = false

[[bench]]
name = "located_expr"
harness = false

[lib]
bench = false

[build-dependencies]
built.workspace = true
#cc.workspace = true
build-deps.workspace = true
fs-err.workspace = true

#[lib]
#crate-type = ["cdylib", "dylib"]


[features]
default = ["colored_errors", "indicatif", "apultra", "bzpack", "exomizer", "lz4", "lz48", "lz49", "lzsa", "pucrunch", "shrinkler", "upkr", "zx0", "zx7"]
colored_errors = []
indicatif = ["dep:indicatif"]
rayon = ["cpclib-common/rayon", "dep:rayon-cond"]
chardet = ["dep:chardetng"]
hfe = ["cpclib-disc/hfe"]

apultra = ["cpclib-crunchers/apultra"]
bzpack = ["cpclib-crunchers/bzpack"]
exomizer = ["cpclib-crunchers/exomizer"]
lz4 = ["cpclib-crunchers/lz4"]
lz48 = ["cpclib-crunchers/lz48"]
lz49 = ["cpclib-crunchers/lz49"]
lzsa = ["cpclib-crunchers/lzsa"]
pucrunch = ["cpclib-crunchers/pucrunch"]
shrinkler = ["cpclib-crunchers/shrinkler"]
zx7 = ["cpclib-crunchers/zx7"]
upkr = ["cpclib-crunchers/upkr"]
zx0 = ["cpclib-crunchers/zx0"]
