[package]
name = "cpclib-sna"
version.workspace = true
description = "cpclib libraries related to snapshots"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true


[package.metadata.workspaces]
independent = true

[dependencies]
cpclib-common.workspace = true

cfg-if.workspace = true
comfy-table = { workspace = true, optional = true }
delegate.workspace = true
fs-err.workspace = true
line-span = { workspace = true, optional = true }
nutype.workspace = true
serde.workspace = true
strum.workspace = true
cpclib-build-argv-derive = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustyline = { workspace = true, optional = true }
minus = { workspace = true, optional = true }

[dev-dependencies]
camino-tempfile.workspace = true
similar-asserts.workspace = true

[build-dependencies]
built.workspace = true

[features]
default = []
cmdline = ["cpclib-common/cmdline", "comfy-table", "cpclib-build-argv-derive"]
interactive = ["rustyline", "minus", "line-span"]

