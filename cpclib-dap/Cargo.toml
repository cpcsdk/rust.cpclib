[package]
name = "cpclib-dap"
version.workspace = true
description = "Debug Adapter Protocol adapter for Amstrad CPC assembly: source-level debugging on top of an emulator that speaks DAP in addresses"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "cpclib-dap"
path = "src/main.rs"
required-features = ["adapter"]

[features]
default = ["adapter"]
# The debug adapter itself: the DAP server, the emulators it launches and talks to, the
# project's builds and source maps. Without it (`default-features = false`) only the
# emulator-independent helpers remain - `disassemble`, `callstack`, `inspect` (without source
# maps), `breakpoint_manager`, `protocol` - light enough for an emulator to show the same views,
# and for the web (wasm32).
adapter = ["dep:cpclib-runner", "dep:cpclib-bndbuild", "dep:cpclib-project"]

[dependencies]
cpclib-project = { workspace = true, optional = true }
cpclib-asm.workspace = true
cpclib-basic.workspace = true
cpclib-sna.workspace = true
# The Gate Array palette is a hardware colour number; turning one into an
# actual colour is this crate's table, not a second copy of it here.
cpclib-image.workspace = true
image.workspace = true
cpclib-tokens.workspace = true
cpclib-common.workspace = true
cpclib-runner = { workspace = true, default-features = false, optional = true }
cpclib-bndbuild = { workspace = true, default-features = false, features = ["rayon"], optional = true }
camino.workspace = true
fs-err.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
camino-tempfile.workspace = true
cpclib-bndbuild = { workspace = true, default-features = false, features = ["rayon"] }
serial_test.workspace = true
