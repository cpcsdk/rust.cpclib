[package]
name = "cpclib-basm"
version.workspace = true
description = "z80 assembler relying on cpclib-asm"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true


[package.metadata.workspaces]
independent = true

[dependencies]
cpclib-asm.workspace = true
cpclib-sna.workspace = true
serde_json.workspace = true
cpclib-common =  {workspace = true, features=["cmdline"]}
cpclib-xfer = {workspace=true, default-features=false, optional=true}
cpclib-disc.workspace = true

fs-err.workspace = true
rust-ini.workspace = true
const_format.workspace = true
enumflags2.workspace = true
#diff = "0.1.13"
time.workspace = true

[dev-dependencies]
test-generator.workspace = true
camino-tempfile.workspace = true
pretty_assertions.workspace = true
globset.workspace = true
regex.workspace = true
serial_test.workspace = true
parking_lot.workspace = true
glob.workspace = true
criterion.workspace = true
strip-ansi-escapes.workspace = true
walkdir.workspace = true

[build-dependencies]
built = { workspace = true, features = ["chrono"] }
build-deps.workspace = true
#static_vcruntime = "2.0"

[[bench]]
name = "basm_benchs"
harness = false


[[bin]]
name = "basm"
path = "src/main.rs"


[features]
default = ["xferlib", "indicatif", "colored_errors", "apultra", "bzpack", "exomizer", "lz4", "lz48", "lz49", "lzsa", "pucrunch", "shrinkler", "zx7", "upkr", "zx0"]
xferlib = ["cpclib-xfer"]
indicatif = ["cpclib-asm/indicatif"]
colored_errors = ["cpclib-asm/colored_errors"]
rayon = ["cpclib-asm/rayon", "cpclib-common/rayon"]
hfe = ["cpclib-disc/hfe", "cpclib-asm/hfe"]
rasm-autotests = []

apultra = ["cpclib-asm/apultra"]
bzpack = ["cpclib-asm/bzpack"]
exomizer = ["cpclib-asm/exomizer"]
lz4 = ["cpclib-asm/lz4"]
lz48 = ["cpclib-asm/lz48"]
lz49 = ["cpclib-asm/lz49"]
lzsa = ["cpclib-asm/lzsa"]
pucrunch = ["cpclib-asm/pucrunch"]
shrinkler = ["cpclib-asm/shrinkler"]
zx7 = ["cpclib-asm/zx7"]
upkr = ["cpclib-asm/upkr"]
zx0 = ["cpclib-asm/zx0"]
