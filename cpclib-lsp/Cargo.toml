[package]
name = "cpclib-lsp"
version.workspace = true
description = "Language Server Protocol implementation for Amstrad CPC development with basm and bndbuild"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "cpclib-lsp"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
cpclib-asm.workspace = true
cpclib-asmfmt.workspace = true
cpclib-bndbuild = { workspace = true, default-features = false, features = ["rayon"] }
cpclib-runner = { workspace = true, default-features = false }
cpclib-basic.workspace = true
cpclib-common = { workspace = true, features = ["cmdline"] }
cpclib-tokens.workspace = true
camino.workspace = true
minijinja.workspace = true

# LSP
tower-lsp = "0.19"
tokio = { version = "1", features = ["full"] }

# Dynamic clap-based completion for internal bndbuild commands
clap_complete = { version = "4.6.7", features = ["unstable-dynamic"] }
shlex.workspace = true

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Text processing
ropey = "1.6"

# Error handling
thiserror = "2"
anyhow = "1"

# Parsing
winnow = "0.6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Collections
dashmap = "6"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
camino-tempfile.workspace = true

[features]
default = []
