[package]
name = "cpclib-lsp"
version.workspace = true
description = "Language Server Protocol implementation for Amstrad CPC development with basm and bndbuild"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "cpclib-lsp"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
cpclib-asm.workspace = true
cpclib-asmfmt.workspace = true
cpclib-asmoptim.workspace = true
cpclib-z80flow.workspace = true
cpclib-basmdoc = { workspace = true, default-features = false }
cpclib-bndbuild = { workspace = true, default-features = false, features = ["rayon", "basmdoc-generator", "tape", "fap", "archive-7z", "apultra", "bzpack", "exomizer", "lz4", "lz48", "lz49", "lzsa", "pucrunch", "shrinkler", "zx7", "upkr", "zx0"] }
cpclib-runner = { workspace = true, default-features = false }
cpclib-basic.workspace = true
cpclib-catart.workspace = true
cpclib-common = { workspace = true, features = ["cmdline"] }
cpclib-project.workspace = true
cpclib-dap.workspace = true
cpclib-tokens.workspace = true
cpclib-z80emu.workspace = true
camino.workspace = true
fs-err.workspace = true
minijinja.workspace = true
either.workspace = true

# LSP
tower-lsp.workspace = true
tokio = { workspace = true, features = ["full"] }

# Dynamic clap-based completion for internal bndbuild commands
clap_complete = { workspace = true, features = ["unstable-dynamic"] }
shlex.workspace = true

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
toml_edit.workspace = true
enumflags2.workspace = true

# Text processing
ropey.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Collections
dashmap.workspace = true

# Cross-file goto-definition: walking the workspace for .asm files
walkdir.workspace = true
ignore.workspace = true
rayon.workspace = true

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
camino-tempfile.workspace = true
futures-util.workspace = true
# Serializes tests that go through `BndBuilder::decode_from_reader`, which
# mutates the process-wide working directory (`std::env::set_current_dir`) -
# same hazard, same fix already established in `cpclib-bndbuild`'s own test
# suite.
serial_test.workspace = true

[features]
default = []
