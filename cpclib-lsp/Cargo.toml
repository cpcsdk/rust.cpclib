[package]
name = "cpclib-lsp"
version.workspace = true
description = "Language Server Protocol implementation for Amstrad CPC development with basm and bndbuild"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "cpclib-lsp"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
cpclib-asm.workspace = true
cpclib-asmfmt.workspace = true
cpclib-asmoptim.workspace = true
cpclib-basmdoc = { workspace = true, default-features = false }
cpclib-bndbuild = { workspace = true, default-features = false, features = ["rayon", "basmdoc-generator", "tape"] }
cpclib-runner = { workspace = true, default-features = false }
cpclib-basic.workspace = true
cpclib-catart.workspace = true
cpclib-common = { workspace = true, features = ["cmdline"] }
cpclib-tokens.workspace = true
cpclib-z80emu.workspace = true
camino.workspace = true
minijinja.workspace = true
either.workspace = true

# LSP
tower-lsp = "0.19"
tokio = { version = "1", features = ["full"] }

# Dynamic clap-based completion for internal bndbuild commands
clap_complete = { version = "4.6.8", features = ["unstable-dynamic"] }
shlex.workspace = true

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.20"
enumflags2 = "0.7.12"

# Text processing
ropey = "1.6"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Collections
dashmap = "6"

# Cross-file goto-definition: walking the workspace for .asm files
walkdir.workspace = true
rayon.workspace = true

[build-dependencies]
serde_json = "1"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
camino-tempfile.workspace = true
futures-util = "0.3"
# Serializes tests that go through `BndBuilder::decode_from_reader`, which
# mutates the process-wide working directory (`std::env::set_current_dir`) -
# same hazard, same fix already established in `cpclib-bndbuild`'s own test
# suite.
serial_test.workspace = true

[features]
default = []
