[package]

name = "cpclib-crunchers"
version.workspace = true
description = "crunchers that are used in cpc world"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[package.metadata.workspaces]
independent = true

[dependencies]
libc.workspace = true
upkr = { workspace = true, optional = true }
zx0 = { workspace = true, optional = true }

[target.'cfg(not(target_arch="wasm32"))'.dependencies]
cxx.workspace = true


[build-dependencies]
built.workspace = true
cc.workspace = true
cxx-build.workspace = true


[features]
default = ["apultra", "bzpack", "exomizer", "lz4", "lz48", "lz49", "lzsa", "pucrunch", "shrinkler", "upkr", "zx0"]
apultra = []
bzpack = []
exomizer = []
lz4 = []
lz48 = []
lz49 = []
lzsa = []
pucrunch = []
shrinkler = []
zx7 = []
upkr = ["dep:upkr"]
zx0 = ["dep:zx0"]



#[lib]
#crate-type = ["cdylib", "dylib"]
